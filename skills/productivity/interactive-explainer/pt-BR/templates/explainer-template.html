<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  Explicador interativo — template autossuficiente (HTML + CSS + JS, sem biblioteca, sem rede).
  Os dados ficam num bloco JSON (id explainer-data) no fim do arquivo; o motor desenha tudo a
  partir deles. Contrato dos dados: EXPLAINER-DATA-FORMAT.md. Não edite o motor para trocar conteúdo:
  edite o JSON e rode scripts/build-explainer.py.
-->
<style>
/* ============ 1. Tokens (tema escuro padrão; claro em [data-theme="light"]) ============ */
:root{
  color-scheme:dark;
  --bg:#1C1C1F; --card:#26262B; --line:#38383E;
  --panel:#16233B; --panel-line:#2C3F66; --well:#0E1730;
  --ink:#FFFFFF; --text:#E4E4E7; --soft:#C9C9CE; --muted:#9A9AA0;
  --brand:#5C80FF; --eyebrow:#7D9BFF;
  --ok:#43D07E; --ok-bg:#0E2A18; --ok-line:#1E5A34; --on-ok:#0B1A10;
  --warn:#E8B23E; --warn-bg:#2A2410; --warn-line:#4A3E18;
  --danger:#F2867A;
  --key:var(--ok); --key-bg:#15291D;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono","Courier New",monospace;
  --gap:16px; --pad:20px; --radius:14px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F6F4; --card:#FFFFFF; --line:#D9D9DF;
  --panel:#EAF0FF; --panel-line:#BFCDF5; --well:#F0F3FA;
  --ink:#101114; --text:#25262B; --soft:#4A4B52; --muted:#6B6C74;
  --brand:#3558E6; --eyebrow:#3558E6;
  --ok:#157A43; --ok-bg:#E3F5EA; --ok-line:#9BD3B2; --on-ok:#FFFFFF;
  --warn:#8A6100; --warn-bg:#FFF4D6; --warn-line:#E6CE85;
  --danger:#B3382B; --key-bg:#E3F5EA;
}

/* ============ 2. Base e tipografia ============ */
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;padding:0 clamp(16px,3vw,48px)}
[hidden]{display:none!important}
.wrap{width:100%;max-width:1760px;margin:0 auto;padding-block:40px 64px;display:grid;gap:48px}
h1,h2,h3,h4{font-weight:500;letter-spacing:-.02em;color:var(--ink);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.03em}
h1 em{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.03em}
h3{font-size:17px;line-height:1.3}
p{margin:0}
code{font-family:var(--mono);font-size:13px;color:var(--eyebrow)}
.eyebrow,.label{font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow);font-size:13px}
.lead{color:var(--soft);font-size:17px;max-width:900px}
.intro{color:var(--soft);font-size:16px;max-width:980px}
.hint{font-size:14px;color:var(--muted)}
header,section{display:grid;gap:20px}
.sechead{display:grid;gap:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--eyebrow)}
:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}

/* ============ 3. Grade de 12 colunas e cartões ============ */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:start}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
@media (max-width:1100px){.s3{grid-column:span 6}.s2{grid-column:span 4}.s8,.s4.side{grid-column:span 12}}
@media (max-width:760px){.s8,.s6,.s4,.s3,.s2{grid-column:span 12}}
.g12.stretch{align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.navy{background:var(--panel);border-color:var(--panel-line)}
.card.key{background:var(--key-bg);border:1.5px solid var(--key)}
.card.key .num,.card.key .label{color:var(--key)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:22px}
.card .body{color:var(--soft);font-size:14px}
.num{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--brand)}
.pill{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.q{background:var(--key);color:var(--on-ok)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.pill.no{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.pill.qa{background:var(--panel);color:var(--eyebrow);border:1px solid var(--panel-line)}
.pill.dev{background:var(--line);color:var(--soft);border:1px solid var(--muted)}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--soft)}
ul.list li{display:grid;grid-template-columns:8px 1fr;gap:10px}
ul.list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:8px}
ul.list b{color:var(--ink);font-weight:600}
dl.kv{margin:0;display:grid;gap:10px;font-size:14px}
dl.kv dt{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
dl.kv dd{margin:2px 0 0;color:var(--text)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--text)}
.note b{color:var(--warn);font-weight:600}
.phrase p{font-weight:500;letter-spacing:-.02em;font-size:20px;color:var(--ink);line-height:1.4}
pre{margin:0;background:var(--well);border:1px solid var(--panel-line);color:var(--soft);font-family:var(--mono);font-size:13px;line-height:1.65;padding:14px 16px;border-radius:10px;overflow-x:auto}
.kw{color:var(--eyebrow)}.tg{color:var(--ok)}.cm{color:var(--muted)}.st{color:var(--warn)}.bad{color:var(--danger)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.card .tablebox{background:transparent}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px;table-layout:fixed}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow)}
td b{color:var(--ink);font-weight:600}
td.y{color:var(--ok)}

/* ============ 4. Abas, esteira (rail) e laço de retorno ============ */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:flex-end}
.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-color:var(--key)}
.tabs .spacer{flex:1}
.theme-btn{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;margin-bottom:6px}
.theme-btn:hover{color:var(--ink);border-color:var(--eyebrow)}
.track{overflow-x:auto;padding-bottom:4px}
.railwrap{position:relative;min-width:var(--rail-min,900px)}
.rail{display:grid;grid-template-columns:repeat(var(--n),minmax(120px,1fr));gap:var(--gap)}
.rail .card{gap:8px}
.rail .card .body{color:var(--muted);font-size:14px}
a.card{text-decoration:none;color:inherit}
a.card:hover,a.card:focus-visible{border-color:var(--eyebrow)}
.railwrap.hasloop{padding-bottom:72px}
.railloop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.railloop path{fill:none;stroke:var(--warn);stroke-width:2}
.railloop circle{fill:var(--warn)}
.railloop polygon{fill:var(--warn)}
.railloop text{fill:var(--warn);font-size:13px;font-weight:600;text-anchor:middle}

/* ============ 5. Papéis (mestre-detalhe) e checklist de gate ============ */
button.role{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.role:hover{border-color:var(--eyebrow)}
.role.active{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.verdictrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.check label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:8px;border-radius:8px;font-size:14px;color:var(--text)}
ul.check label:hover{background:var(--line)}
ul.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand);flex:none}
ul.check small{display:block;color:var(--muted);font-size:14px}
ul.check li.grp{padding:10px 8px 2px;color:var(--muted)}
.reset{font:inherit;font-size:14px;background:transparent;color:var(--eyebrow);border:1px solid var(--panel-line);border-radius:8px;padding:7px 14px;cursor:pointer;align-self:flex-start;justify-self:start}
.sample-stack{display:grid;gap:12px}

/* ============ 6. Dica flutuante (tooltip) ============ */
.tip{border-bottom:1px dashed currentColor;cursor:help}
.tip::after{content:"i";display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid currentColor;font-size:11px;font-weight:700;font-style:normal;vertical-align:1px}
#tipbox{position:fixed;z-index:10;max-width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:grid;gap:10px;font-size:14px;color:var(--text);pointer-events:none}
#tipbox b{color:var(--ink);font-weight:600}

/* ============ 7. Tipos de peça: cor, chip, legenda ============ */
.t{--c:var(--c0)}
:root[data-theme="light"] .t{--c:var(--c0l,color-mix(in srgb,var(--c0) 60%,#000))}
.chip{font:inherit;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);white-space:nowrap;line-height:1.5}
button.chip{cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend button{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 8px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.legend button:hover{border-color:var(--line)}
.legend button[aria-pressed="true"]{border-color:var(--c);color:var(--ink)}
.legend b{color:var(--soft);font-weight:600}

/* ============ 8. Quadro de nós e setas (board) ============ */
.stepper{display:flex;flex-wrap:wrap;gap:8px}
.stepper button{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:15px;font-weight:600}
.stepper .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.stepper .gate .n{background:var(--key);color:var(--on-ok)}
.stepper .off{color:var(--muted)}
.stepper .off .n{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.stepper button:hover{border-color:var(--eyebrow)}
.stepper button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stage{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);padding:clamp(18px,2.4vw,28px);display:grid;gap:24px}
.ehead{display:grid;gap:10px;max-width:880px}
.ehead h3{font-size:22px}
.ehead p{color:var(--soft)}
.estados{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.est{font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--well);border:1px solid var(--panel-line);color:var(--soft)}
.estados i{color:var(--muted);font-style:normal}
.estados .lbl{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.empty{color:var(--soft);font-size:16px;max-width:720px}
.btools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btools button{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--eyebrow);border:1px solid var(--panel-line);border-radius:8px;padding:5px 12px;cursor:pointer}
.btools button:hover{border-color:var(--eyebrow)}
.btools button[disabled]{opacity:.4;cursor:default}
.btools .hint{margin-left:auto}
.canvas{overflow-x:auto;border:1px solid var(--panel-line);border-radius:12px;background-color:var(--well);background-image:radial-gradient(color-mix(in srgb,var(--muted) 30%,transparent) 1px,transparent 1.3px);background-size:22px 22px;padding:32px 28px}
.graph{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(168px,208px));column-gap:var(--cgap,48px);row-gap:30px;justify-content:center;min-width:calc(var(--cols) * 168px + (var(--cols) - 1) * var(--cgap,48px));align-items:center}
.node{position:relative;z-index:1;font:inherit;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.node:hover{border-color:var(--c)}
.node.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent),0 6px 18px rgba(0,0,0,.28)}
.node.dim{opacity:.35}
.node:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.node .ic{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.node .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node .tx{display:grid;gap:1px;min-width:0}
.node .kd{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.node .nm{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3;overflow-wrap:break-word}
.node .sb{font-size:12.5px;color:var(--muted);line-height:1.35}
.node .sb code{font-size:12px;color:var(--soft)}
.node::before,.node::after{content:"";position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--well);border:1.5px solid var(--line)}
.node::before{left:-5px}.node::after{right:-5px}
.node.guard{border-style:dashed;background:color-mix(in srgb,var(--c) 6%,var(--card));box-shadow:none;padding:8px 12px}
.node.guard .ic{width:26px;height:26px}
.node.guard::before,.node.guard::after{display:none}
.node.hyp{outline:2px dotted var(--warn);outline-offset:2px}
.hy{align-self:flex-start;white-space:nowrap;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:999px;padding:1px 8px}
.dsrc.hyp{color:var(--warn)}
.bsrc{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.bsrc.hyp{color:var(--warn)}
.card .bsrc{margin-top:auto}
.embed{width:100%;border:1px solid var(--panel-line);border-radius:var(--radius);background:var(--card);display:block}
svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.edges path[data-a]{fill:none;stroke:color-mix(in srgb,var(--muted) 75%,transparent);stroke-width:1.6}
.edges path.gd{stroke:var(--gc,var(--warn));stroke-dasharray:5 5;opacity:.7}
.edges path.dim{opacity:.35}
.edges path.on{stroke:var(--ink);stroke-width:2.2;opacity:1}
.edges path.gd.on{stroke:var(--gc,var(--warn))}
.edges path.hyp{stroke-dasharray:2 6}
.elabels{position:absolute;inset:0;pointer-events:none;z-index:2}
.elabels span{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:600;color:var(--soft);background:var(--well);padding:1px 7px;border-radius:6px;border:1px solid var(--panel-line);white-space:nowrap}
.elabels span.dim{opacity:.45}
.detail{display:grid;gap:16px}
.dhead{display:grid;gap:8px;max-width:760px;padding-left:14px;border-left:3px solid var(--c)}
.dhead p{color:var(--soft);font-size:15px}
.dsrc{font-size:13px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--gap);align-items:start}
.catcard{border-top:3px solid var(--c)}
.catcard h3{font-family:var(--mono);font-size:15px;letter-spacing:0}
.catcard dl{margin:0;display:grid;gap:10px;font-size:14px}
.catcard dt{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.catcard dd{margin:3px 0 0;color:var(--soft)}
.catcard.hl{box-shadow:0 0 0 2px var(--c)}
@media (prefers-reduced-motion:no-preference){.pill,.role,.node,.catcard{transition:background .2s,color .2s,box-shadow .2s,border-color .2s}}

/* ============ 9. Impressão ============ */
@media print{
  :root,:root[data-theme]{--bg:#fff;--card:#fff;--line:#bbb;--panel:#f3f3f3;--panel-line:#bbb;--well:#f7f7f7;--ink:#000;--text:#111;--soft:#333;--muted:#555}
  body{padding:0}.tabs,.btools,.theme-btn{display:none!important}
  .tab-panel[hidden]{display:grid!important}
}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="hint">Carregando…</p></div>
<noscript><p class="hint" style="padding:24px">Este explicador precisa de JavaScript para desenhar os quadros. Ative o JavaScript do navegador, ou peça a versão em documento.</p></noscript>
<div id="tipbox" role="tooltip" hidden></div>

<script type="application/json" id="explainer-data">/*__EXPLAINER_DATA__*/</script>
<script>
(function(){
'use strict';

/* ================================================================
   Motor do explicador. Tudo é desenhado a partir de #explainer-data.
   Seções: 1 utilitários · 2 tipos de peça e ícones · 3 auto-layout ·
   4 blocos estáticos · 5 quadro (board) · 6 arestas · 7 interação ·
   8 navegação por hash · 9 autoteste de geometria.
   ================================================================ */

var D;
try { D = JSON.parse(document.getElementById('explainer-data').textContent); }
catch (err) {
  var raw = document.getElementById('explainer-data').textContent;
  document.getElementById('app').innerHTML = raw.indexOf('__EXPLAINER_DATA__') >= 0
    ? '<p><b>Este é o template do motor, não um explicador.</b></p><p>Ele só funciona depois de receber os dados. Gere o explicador com <code>python3 scripts/build-explainer.py dados.json --out explicador.html</code> e abra o arquivo gerado (exemplo de dados: <code>examples/online-order.data.json</code>).</p>'
    : '<p>Dados do explicador inválidos: ' + String(err.message) + '</p>';
  return;
}

var ERRORS = [];
window.addEventListener('error', function (e) { ERRORS.push(String(e.message)); });

/* ---------- 1. Utilitários ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// Campos de texto dos dados aceitam HTML inline (<b>, <code>, <em>): são escritos por quem monta o explicador.
function H(s) { return s == null ? '' : String(s); }
var UI = { prev: '◀ Passo anterior', play: '▶ Reproduzir fluxo', pause: '❚❚ Pausar', next: 'Próximo passo ▶', hint: 'Clique numa caixa ou use as setas do teclado.',
  stage: 'Etapa', state: 'Estado', role: 'Papel', does: 'Responsabilidades', sample: 'Amostra', reset: 'Voltar ao exemplo', gate: 'Gate', gatePass: 'passa', gateFail: 'devolvido',
  source: 'Fonte', quote: 'Trecho', unconfirmed: 'a confirmar', unconfirmedEdge: 'ligação a confirmar', hypothesisNote: 'Hipótese: ainda não confirmada na fonte.',

    requestAnimationFrame(function () { $('#blk-' + h.block).scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); });
  }
}
function redrawBoards() { Object.keys(S.boards).forEach(function (id) { var el = $('#graph-' + id); if (el && el.offsetWidth) drawEdges(id); }); }

/* ---------- Montagem da página ---------- */
function buildApp() {
  var m = D.meta || {};
  document.title = m.title || document.title;
  document.documentElement.lang = m.lang || 'pt-BR';
  var themePref = store('explainer-theme') || m.theme || 'dark';
  applyTheme(themePref);
  var tabsHtml = D.tabs.map(function (t) { return '<a href="#' + esc(t.id) + '" data-tab="' + esc(t.id) + '">' + H(t.label) + '</a>'; }).join('');
  var out = '<header>' + (m.eyebrow ? '<div class="eyebrow">' + H(m.eyebrow) + '</div>' : '') + '<h1>' + H(m.heading || m.title) + '</h1>' + (m.lead ? '<p class="lead">' + H(m.lead) + '</p>' : '') +
    '<nav class="tabs" aria-label="' + esc(L('views')) + '">' + tabsHtml + '<span class="spacer"></span><button class="theme-btn" type="button" data-theme-toggle aria-label="' + esc(L('themeAria')) + '">' + H(L('theme')) + '</button></nav></header>';
  var auto = 0;
  D.tabs.forEach(function (t) {
    t.blocks.forEach(function (bl) { if (!bl.id) bl.id = 'b' + (auto++); });
    out += '<div class="tab-panel" data-tab="' + esc(t.id) + '" hidden style="display:grid;gap:48px">' + t.blocks.map(function (b) {
      if (b.id) BLOCKS[b.id] = b;
      if (b.type === 'board') { S.boards[b.id] = { stage: b.start || 0, node: null, focusType: null }; }
      if (b.type === 'roles') { S.roles[b.id] = 0; }
      switch (b.type) {
        case 'text': return withNote('<section>' + sechead(b) + '</section>', b);
        case 'rail': return withNote(renderRail(b), b);
        case 'matrix': return withNote(renderMatrix(b), b);
        case 'cards': return withNote(renderCards(b), b);
        case 'phrase': return withNote(renderPhrase(b), b);
        case 'roles': return withNote(renderRoles(b), b);
        case 'board': return withNote(renderBoardShell(b), b);
        case 'sample': return withNote(renderSampleBlock(b), b);
        case 'embed': return withNote(renderEmbed(b), b);
        case 'html': return withNote('<section>' + H(b.html) + '</section>', b);
        default: return '';
      }
    }).join('') + '</div>';
  });
  $('#app').innerHTML = out;
  $$('iframe[data-embed]').forEach(function (f) { var eb = BLOCKS[f.getAttribute('data-embed')]; if (eb && eb.srcdoc) f.srcdoc = eb.srcdoc; });
}
function applyTheme(t) {
  var eff = t === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.setAttribute('data-theme', eff === 'light' ? 'light' : 'dark');
}

/* ---------- Interação (delegação de eventos) ---------- */
document.addEventListener('click', function (ev) {
  var t = ev.target;
  var el = t.closest('[data-theme-toggle]');
  if (el) { var cur = document.documentElement.getAttribute('data-theme'), nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); store('explainer-theme', nx); redrawBoards(); return; }
  el = t.closest('[data-stage]');
  if (el) { var bid = el.getAttribute('data-board'); if (TIMERS[bid]) togglePlay(bid); S.boards[bid].stage = +el.getAttribute('data-stage'); S.boards[bid].node = null; S.active = bid; renderStage(boardOf(bid)); writeHash(); var f = $('[data-board="' + bid + '"][data-stage="' + S.boards[bid].stage + '"]'); if (f) f.focus(); return; }
  el = t.closest('[data-prev]'); if (el) { S.active = el.getAttribute('data-prev'); stepFlow(el.getAttribute('data-prev'), -1); return; }
  el = t.closest('[data-next]'); if (el) { S.active = el.getAttribute('data-next'); stepFlow(el.getAttribute('data-next'), 1); return; }
  el = t.closest('[data-play]'); if (el) { S.active = el.getAttribute('data-play'); togglePlay(el.getAttribute('data-play')); return; }
  el = t.closest('[data-legend]');
  if (el) { var lb = el.getAttribute('data-legend'), ty = el.getAttribute('data-type'); S.boards[lb].focusType = S.boards[lb].focusType === ty ? null : ty; $$('[data-legend="' + lb + '"]').forEach(function (x) { x.setAttribute('aria-pressed', x.getAttribute('data-type') === S.boards[lb].focusType); }); markEdges(lb); return; }
  el = t.closest('.node[data-node]'); if (el) { S.active = el.getAttribute('data-board'); selectNode(el.getAttribute('data-board'), el.getAttribute('data-node')); return; }
  el = t.closest('[data-ref]');
  if (el) {
    var ref = el.getAttribute('data-ref'), host = t.closest('[data-block="board"]'); if (!host) return;
    var bd = host.id.replace(/^blk-/, ''), bb = boardOf(bd), stg = stageOf(bb, S.boards[bd].stage);
    var hit = (stg.graph ? stg.graph.nodes : []).filter(function (n) { return [].concat(n.refs || []).indexOf(ref) >= 0; })[0];
    if (hit) { selectNode(bd, hit.id); var ne = $('#graph-' + bd + ' [data-node="' + hit.id + '"]'); if (ne) ne.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest', inline: 'center' }); }
    return;
  }
  el = t.closest('button.role[data-role]');
  if (el) { var rb = el.getAttribute('data-role-block'); S.roles[rb] = +el.getAttribute('data-role'); refreshRoles(rb); var nf = $('[data-role-block="' + rb + '"][data-role="' + S.roles[rb] + '"]'); if (nf) nf.focus(); return; }
  el = t.closest('[data-reset]'); if (el) { delete GATE[el.getAttribute('data-reset')]; var rr = el.getAttribute('data-reset').split(':')[0]; refreshRoles(rr); return; }
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-gate]'); if (!el) return;
  var key = el.getAttribute('data-gate'); GATE[key][+el.getAttribute('data-i')] = el.checked;
  var bid = key.split(':')[0], i = +el.getAttribute('data-i'); refreshRoles(bid);
  var again = $('[data-gate="' + key + '"][data-i="' + i + '"]'); if (again) again.focus();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') closeTip();
  var node = ev.target.closest && ev.target.closest('.node[data-node]');
  if (node && /^Arrow(Left|Right|Up|Down)$/.test(ev.key)) {
    var bid = node.getAttribute('data-board'), next = neighbor(bid, ev.key);
    if (next) { ev.preventDefault(); S.active = bid; selectNode(bid, next); var f = $('#graph-' + bid + ' [data-node="' + next + '"]'); if (f) f.focus(); }
  }
});
var tipbox = $('#tipbox');
function openTip(el) {
  tipbox.innerHTML = TIPS[el.getAttribute('data-tip')] || ''; tipbox.hidden = false;
  var r = el.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  var x = Math.min(Math.max(16, r.left), innerWidth - w - 16), y = r.bottom + 10;
  if (y + h > innerHeight - 16) y = Math.max(16, r.top - h - 10);
  tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px';
}
function closeTip() { tipbox.hidden = true; }
document.addEventListener('mouseover', function (ev) { var el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) openTip(el); });
document.addEventListener('mouseout', function (ev) { if (ev.target.closest && ev.target.closest('[data-tip]')) closeTip(); });
document.addEventListener('focusin', function (ev) { var el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) openTip(el); });
document.addEventListener('focusout', function (ev) { if (ev.target.closest && ev.target.closest('[data-tip]')) closeTip(); });
window.addEventListener('scroll', closeTip, { passive: true });
window.addEventListener('hashchange', function () { showTab(true); });

/* ---------- Inicialização ---------- */
buildApp();
showTab(location.hash.length > 1);
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function () { requestAnimationFrame(function () { redrawBoards(); drawRailLoops(); }); });
  $$('.graph, .railwrap').forEach(function (el) { ro.observe(el); });
  var roRoot = new ResizeObserver(function () { requestAnimationFrame(function () { $$('.graph, .railwrap').forEach(function (el) { try { ro.observe(el); } catch (e) {} }); }); });
  roRoot.observe($('#app'));
} else { window.addEventListener('resize', function () { requestAnimationFrame(function () { redrawBoards(); drawRailLoops(); }); }); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { requestAnimationFrame(function () { redrawBoards(); drawRailLoops(); }); });

/* ---------- 9. Autoteste de geometria (?selftest ou window.ExplainerSelfTest()) ---------- */
// rAF não dispara em aba em segundo plano nem de forma confiável em Chrome headless: resolve com rAF OU timeout.
function tick() { return new Promise(function (res) { var done = false; function f() { if (!done) { done = true; res(); } } requestAnimationFrame(f); setTimeout(f, 40); }); }
function raf2() { return tick().then(tick); }
function ptInRect(p, r, inset) { return p.x > r.l + inset && p.x < r.r - inset && p.y > r.t + inset && p.y < r.b - inset; }
window.ExplainerSelfTest = async function () {
  var problems = [], stats = { boards: 0, stages: 0, nodes: 0, edges: 0, labels: 0 };
  var startTab = S.tab, startHash = location.hash;
  for (var ti = 0; ti < D.tabs.length; ti++) {
    var tab = D.tabs[ti];
    var boards = tab.blocks.filter(function (x) { return x.type === 'board'; });
    if (!boards.length) continue;
    location.hash = '#' + tab.id; showTab(false); await raf2();
    for (var bi = 0; bi < boards.length; bi++) {
      var b = boards[bi]; stats.boards++;
      for (var si = 0; si < b.stages.length; si++) {
        var e = b.stages[si]; if (!e.graph) continue;
        S.boards[b.id].stage = si; S.boards[b.id].node = null; renderStage(b);
        await raf2(); drawEdges(b.id); await raf2();
        stats.stages++; var gm = GEOM[b.id]; var where = b.id + '/etapa ' + si;
        if (!gm) { problems.push({ level: 'error', where: where, msg: 'geometria não medida (grafo invisível?)' }); continue; }
        var ids = Object.keys(gm.box); stats.nodes += ids.length;
        for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++)
          if (rectsOverlap(gm.box[ids[i]], gm.box[ids[j]], 0)) problems.push({ level: 'error', where: where, msg: 'nós sobrepostos: ' + ids[i] + ' e ' + ids[j] });
        gm.edges.forEach(function (ed) {
          stats.edges++;
          var A = gm.box[ed.from], B = gm.box[ed.to]; if (!A || !B) return;
          var crossed = ids.filter(function (k) { return k !== ed.from && k !== ed.to && ed.pts.some(function (p) { return ptInRect(p, gm.box[k], 3); }); });
          if (crossed.length) problems.push({ level: 'warn', where: where, msg: 'aresta ' + ed.from + '→' + ed.to + ' atravessa o nó ' + crossed.join(', ') });
          var first = ed.pts[0], last = ed.pts[ed.pts.length - 1];
          var near = function (p, r) { return p.x >= r.l - 8 && p.x <= r.r + 8 && p.y >= r.t - 8 && p.y <= r.b + 8; };
          if (!near(first, A) || !near(last, B)) problems.push({ level: 'error', where: where, msg: 'aresta ' + ed.from + '→' + ed.to + ' não encosta nas caixas' });
        });
        $$('#elabels-' + b.id + ' span').forEach(function (sp) {
          stats.labels++;
          var r = sp.getBoundingClientRect(), base = gm.base, rc = { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top };
          ids.forEach(function (k) { if (rectsOverlap(rc, gm.box[k], 0)) problems.push({ level: 'warn', where: where, msg: 'rótulo "' + sp.textContent + '" cobre o nó ' + k }); });
        });
        var placed = gm.labels;
        for (var x = 0; x < placed.length; x++) for (var y = x + 1; y < placed.length; y++)
          if (rectsOverlap(placed[x], placed[y], 0)) problems.push({ level: 'warn', where: where, msg: 'dois rótulos de aresta se sobrepõem' });
      }
    }
  }
  if (document.documentElement.scrollWidth > innerWidth + 1) problems.push({ level: 'error', where: 'página', msg: 'rolagem horizontal da página (' + document.documentElement.scrollWidth + 'px > ' + innerWidth + 'px)' });
  ERRORS.forEach(function (m) { problems.push({ level: 'error', where: 'script', msg: m }); });
  location.hash = startHash || '#' + startTab; showTab(false);
  var result = { ok: !problems.some(function (p) { return p.level === 'error'; }), width: innerWidth, stats: stats, problems: problems };
  document.documentElement.setAttribute('data-selftest', JSON.stringify(result));
  try { console.log('SELFTEST ' + JSON.stringify(result)); } catch (e) {}
  return result;
};
if (/[?&]selftest\b/.test(location.search)) { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { return raf2(); }).then(function () { return window.ExplainerSelfTest(); }); }
})();
