<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador passo a passo</title>
<!--
  FORMATO: simulador. Responde "com ESTES dados, o que o processo faz?" e deixa o leitor testar os casos de borda.
  COMO ADAPTAR: edite INPUTS (campos do formulário) e a lista RULES (cada regra: id, rótulo e teste (state) => booleano), e
  o grafo GRAPH (nó -> {q:regra, sim:id, nao:id} ou {fim:texto}). IDEIA CENTRAL: a mesma regra de negócio roda de verdade
  (função JS) e o trajeto aceso no diagrama é o RASTRO da execução. O leitor muda 10.000,00 para 10.000,01 e vê o
  caminho trocar: o valor-limite deixa de ser um parágrafo e vira algo que ele experimenta. Mostre também o rastro em texto.
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
button{font:inherit}:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.in{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}.in label{display:grid;gap:4px;font-size:14px;color:var(--soft)}.in input[type=number],.in select{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
.in .chk{display:flex;gap:10px;align-items:center}.presets{display:flex;flex-wrap:wrap;gap:6px}.presets button{background:transparent;color:var(--eyebrow);border:1px solid var(--panel-line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.stage{border:1px solid var(--panel-line);border-radius:14px;background:var(--well);padding:16px;overflow-x:auto}svg{display:block;min-width:620px;width:100%;height:auto}
.n rect{fill:var(--card);stroke:var(--line);stroke-width:1.4}.n text{fill:var(--text);font:600 12.5px var(--sans);text-anchor:middle;dominant-baseline:central}.n.fim rect{stroke-dasharray:4 3}
.n.hit rect{stroke:var(--brand);stroke-width:2.6}.n.last rect{fill:color-mix(in srgb,var(--c,var(--brand)) 22%,var(--card));stroke:var(--c,var(--brand));stroke-width:3}.n.off{opacity:.38}
.e{fill:none;stroke:color-mix(in srgb,var(--muted) 65%,transparent);stroke-width:1.5}.e.hit{stroke:var(--brand);stroke-width:3}.el{fill:var(--muted);font:600 11px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--well);stroke-width:4px}marker path{stroke:none}
.result{margin-top:12px;border-left:4px solid var(--c);padding:6px 0 6px 14px;background:none}.result.ok{--c:var(--ok)}.result.warn{--c:var(--warn)}.result.no{--c:var(--danger)}.result h2{margin:0;font-size:20px;color:var(--ink)}.result p{margin:0;color:var(--soft)}
ol.trace{margin:10px 0 0;padding-left:20px;font:13px/1.6 var(--mono);color:var(--soft)}ol.trace b{color:var(--ink)}
</style></head><body>
<div class="eyebrow">Formato · simulador</div><h1>O que acontece com ESTE pedido?</h1>
<p class="lead">Mude os dados e veja o caminho percorrido e o desfecho. Experimente os valores-limite: R$ 10.000,00 e R$ 10.000,01 levam a caminhos diferentes.</p>
<div class="wrap"><div class="in" id="in"></div><div><div class="stage"><svg id="svg" aria-label="Diagrama do processo com o caminho percorrido"></svg></div><div class="result" id="res"></div><ol class="trace" id="trace"></ol></div></div>
<script>
const state={valor:10000,gestor:true,mesma:true};
const PRESETS=[{n:'Limite exato',s:{valor:10000,gestor:true,mesma:true}},{n:'Um centavo acima',s:{valor:10000.01,gestor:true,mesma:true}},{n:'Área sem gestor',s:{valor:15000,gestor:false,mesma:true}},{n:'Gestor de outra área',s:{valor:15000,gestor:true,mesma:false}}];
const G={ini:{x:0,y:1,t:'Pedido enviado',q:'valor',sim:'g',nao:'ok',lq:'Valor > R$ 10.000,00?'},
 g:{x:1,y:0,t:'Área tem gestor?',q:'gestor',sim:'m',nao:'bloq'},m:{x:2,y:0,t:'Gestor da mesma área?',q:'mesma',sim:'aguarda',nao:'neg'},
 ok:{x:1,y:2,s:'Aprovado',fim:'Aprovado automaticamente',k:'ok'},bloq:{x:2,y:1,s:'Bloqueado',fim:'Envio bloqueado: "Área sem aprovador"',k:'no'},aguarda:{x:3,y:0,s:'Aguarda o gestor',fim:'Aguarda o gestor',k:'warn'},neg:{x:3,y:1.1,s:'Negado',fim:'Ação negada e registrada',k:'no'}};  // s = rótulo curto do nó; fim = frase completa do resultado
const RULE={valor:s=>s.valor>10000,gestor:s=>s.gestor,mesma:s=>s.mesma};
const LAB={valor:'valor acima do limite',gestor:'a área tem gestor',mesma:'o gestor é da mesma área'};
function run(s){const path=['ini'],steps=[];let id='ini';while(G[id].q){const n=G[id],r=RULE[n.q](s);steps.push({id,r,l:LAB[n.q]});id=r?n.sim:n.nao;path.push(id)}return{path,steps,end:id}}
// UI
const inp=document.getElementById('in');inp.innerHTML=`<div class="presets">${PRESETS.map((p,i)=>`<button type="button" data-p="${i}">${p.n}</button>`).join('')}</div><label>Valor do pedido (R$)<input type="number" id="valor" step="0.01" value="${state.valor}"></label><label class="chk"><input type="checkbox" id="gestor" ${state.gestor?'checked':''}> A área tem gestor cadastrado</label><label class="chk"><input type="checkbox" id="mesma" ${state.mesma?'checked':''}> O gestor é da mesma área do pedido</label>`;
// diagrama
const W=150,H=44,GX=190,GY=96,PX=90,PY=40,svg=document.getElementById('svg');const ids=Object.keys(G);const vw=PX*2+3*GX,vh=PY*2+2*GY;svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);
const P=id=>({x:PX+G[id].x*GX,y:PY+G[id].y*GY});const edges=[];ids.forEach(id=>{const n=G[id];if(n.q){edges.push([id,n.sim,'Sim']);edges.push([id,n.nao,'Não'])}});
function draw(r){let h='<defs>'+[['mn','var(--muted)'],['mh','var(--brand)']].map(([i,c])=>`<marker id="${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:${c}"/></marker>`).join('')+'</defs>';
 edges.forEach(([a,b,l])=>{const A=P(a),B=P(b),hit=r.path.includes(a)&&r.path[r.path.indexOf(a)+1]===b,x1=A.x+W/2,y1=A.y,x2=B.x-W/2,y2=B.y,dx=Math.max(30,(x2-x1)/2);h+=`<path class="e${hit?' hit':''}" d="M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}" marker-end="url(#${hit?'mh':'mn'})"/><text class="el" x="${(x1+x2)/2}" y="${(y1+y2)/2}">${l}</text>`});
 ids.forEach(id=>{const n=G[id],p=P(id),hit=r.path.includes(id),last=r.end===id;const col=n.k==='ok'?'var(--ok)':n.k==='no'?'var(--danger)':n.k==='warn'?'var(--warn)':'var(--brand)';
  h+=`<g class="n${n.fim?' fim':''}${hit?' hit':''}${last?' last':''}${!hit?' off':''}" style="--c:${col}"><rect x="${p.x-W/2}" y="${p.y-H/2}" width="${W}" height="${H}" rx="10"/><text x="${p.x}" y="${p.y}">${n.t||n.s}</text><title>${n.t||n.fim}</title></g>`});svg.innerHTML=h}
function go(){const r=run(state),end=G[r.end];draw(r);const el=document.getElementById('res');el.className='result '+end.k;el.innerHTML=`<h2>${end.fim}</h2><p>Com valor R$ ${state.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}${state.gestor?'':', área sem gestor'}${!state.mesma?', gestor de outra área':''}.</p>`;
 document.getElementById('trace').innerHTML=r.steps.map(s=>`<li>${s.l}? <b>${s.r?'sim':'não'}</b></li>`).join('')}
inp.addEventListener('input',e=>{if(e.target.id==='valor')state.valor=parseFloat(e.target.value)||0;else if(e.target.id)state[e.target.id]=e.target.checked;go()});
inp.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;Object.assign(state,PRESETS[+b.dataset.p].s);document.getElementById('valor').value=state.valor;document.getElementById('gestor').checked=state.gestor;document.getElementById('mesma').checked=state.mesma;go()});go();
</script></body></html>
