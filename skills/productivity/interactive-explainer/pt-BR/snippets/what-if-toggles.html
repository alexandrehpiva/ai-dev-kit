<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E se...? (interruptores)</title>
<!--
  FORMATO: "e se...?" com interruptores. Responde "o que muda quando eu ligo/desligo isto?" deixando o leitor mexer.
  COMO ADAPTAR: edite SWITCHES (id, rótulo, dica) e a função route(state), que devolve o caminho (lista de nós), a latência
  e o resultado. IDEIA CENTRAL: o diagrama é uma FUNÇÃO do estado dos interruptores. Cada interruptor que muda o desfecho
  mostra o efeito na hora (caminho aceso, número que sobe/desce, texto do resultado). Isso é simulação, não ilustração:
  o leitor descobre a regra sozinho. Preferir poucos interruptores (até 4); cada um deve mudar algo visível.
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.ctl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.sw{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;cursor:pointer}.sw input{position:absolute;opacity:0}.sw .tr{width:44px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.tr{background:var(--brand)}.sw input:checked+.tr::after{transform:translateX(20px)}.sw input:focus-visible+.tr{outline:2px solid var(--eyebrow);outline-offset:2px}.sw b{color:var(--ink);display:block;font-size:15px}.sw small{color:var(--muted);font-size:13px}
.stage{border:1px solid var(--panel-line);border-radius:14px;background:var(--well);padding:20px;display:grid;gap:16px}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.nd{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--muted);opacity:.45;transition:all .2s}.nd.on{opacity:1;color:var(--ink);border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}.nd.bad.on{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.ar{color:var(--muted)}.ar.on{color:var(--brand)}
.kpi{display:flex;gap:24px;flex-wrap:wrap}.kpi div{display:grid}.kpi b{font-size:30px;color:var(--ink);line-height:1.1;letter-spacing:-.02em}.kpi small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.out{border-left:4px solid var(--c);padding:4px 0 4px 14px;color:var(--soft)}.out.ok{--c:var(--ok)}.out.bad{--c:var(--danger)}.out.warn{--c:var(--warn)}.out b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.nd,.sw .tr,.sw .tr::after{transition:none}}
</style></head><body>
<div class="eyebrow">Formato · e se...?</div><h1>O que muda quando o sistema ganha cache?</h1>
<p class="lead">Ligue e desligue os interruptores. O caminho aceso, o tempo de resposta e o desfecho se recalculam na hora.</p>
<div class="wrap"><div class="ctl" id="ctl"></div><div class="stage"><div class="path" id="path"></div><div class="kpi"><div><b id="ms">0 ms</b><small>tempo de resposta</small></div><div><b id="load">0</b><small>consultas ao banco</small></div></div><div class="out" id="out"></div></div></div>
<script>
const SWITCHES=[{id:'cache',t:'Cache ligado',d:'Guarda respostas recentes em memória'},{id:'db',t:'Banco fora do ar',d:'Simula uma falha do banco de dados'},{id:'login',t:'Usuário logado',d:'Sem login, a API recusa na entrada'}];
const NODES=['Cliente','API','Cache','Banco','Resposta'];
const state={cache:false,db:false,login:true};
function route(s){ // devolve {nodes:[índices acesos], ms, db:consultas, bad:índice do nó que falhou, out:{k,t}}
 if(!s.login)return{nodes:[0,1],ms:15,db:0,bad:1,out:{k:'bad',t:'<b>401 Não autorizado.</b> A API recusa antes de gastar cache ou banco.'}};
 if(s.cache)return{nodes:[0,1,2,4],ms:20,db:0,out:{k:'ok',t:'<b>Servido pelo cache.</b> Nenhuma consulta ao banco: rápido e imune à falha do banco.'}};
 if(s.db)return{nodes:[0,1,3],ms:3000,db:1,bad:3,out:{k:'bad',t:'<b>503 Indisponível.</b> Sem cache, uma falha do banco derruba a resposta (e demora 3 s até desistir).'}};
 return{nodes:[0,1,3,4],ms:180,db:1,out:{k:'warn',t:'<b>Servido pelo banco.</b> Funciona, mas cada requisição custa uma consulta.'}}}
const ctl=document.getElementById('ctl');ctl.innerHTML=SWITCHES.map(s=>`<label class="sw"><input type="checkbox" data-id="${s.id}" ${state[s.id]?'checked':''}><span class="tr"></span><span><b>${s.t}</b><small>${s.d}</small></span></label>`).join('');
function render(){const r=route(state);document.getElementById('path').innerHTML=NODES.map((n,i)=>{const on=r.nodes.includes(i),next=r.nodes[r.nodes.indexOf(i)+1];return `<span class="nd${on?' on':''}${r.bad===i?' bad':''}">${n}</span>${i<NODES.length-1?`<span class="ar${on&&next!=null&&r.nodes.includes(i+1)||(on&&next===i+2)?' on':''}">→</span>`:''}`}).join('');
 document.getElementById('ms').textContent=r.ms>=1000?(r.ms/1000).toFixed(1)+' s':r.ms+' ms';document.getElementById('load').textContent=r.db;const o=document.getElementById('out');o.className='out '+r.out.k;o.innerHTML=r.out.t}
ctl.addEventListener('change',e=>{state[e.target.dataset.id]=e.target.checked;render()});render();
</script></body></html>
