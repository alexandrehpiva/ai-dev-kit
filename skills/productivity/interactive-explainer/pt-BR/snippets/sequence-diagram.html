<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagrama de sequência</title>
<!--
  FORMATO: diagrama de sequência. Responde "em que ORDEM quem fala com quem?" (o tempo corre de cima para baixo).
  COMO ADAPTAR: edite ACTORS (colunas) e MSGS (de, para, texto, tipo 'call' | 'return' | 'async', nota opcional).
  IDEIA CENTRAL: revelar uma mensagem por vez ("Próxima") com as seguintes esmaecidas. O leitor acompanha a
  conversa como num diálogo, em vez de decifrar 12 setas de uma vez. Retorno é tracejado; chamada assíncrona tem ponta aberta.
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
button{font:inherit}:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools button{background:transparent;color:var(--eyebrow);border:1px solid var(--panel-line);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}.tools button[disabled]{opacity:.4;cursor:default}.tools span{color:var(--muted);font-size:14px;margin-left:auto}
.stage{border:1px solid var(--panel-line);border-radius:14px;background:var(--well);overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
.head rect{fill:var(--card);stroke:var(--line)}.head text{fill:var(--ink);font:600 14px var(--sans);text-anchor:middle;dominant-baseline:central}
.life{stroke:color-mix(in srgb,var(--muted) 55%,transparent);stroke-dasharray:4 5;stroke-width:1.4}
.m{transition:opacity .25s}.m.future{opacity:.12}.m.past{opacity:.55}.m.now{opacity:1}
.m line,.m path.ln{stroke:var(--text);stroke-width:1.8;fill:none}.m.ret line{stroke-dasharray:6 5;stroke:var(--soft)}.m text{fill:var(--ink);font:500 13px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--well);stroke-width:4px}
.m.now line{stroke:var(--brand);stroke-width:2.6}.m .num{fill:var(--brand);font:700 11px var(--sans)}
.note rect{fill:color-mix(in srgb,var(--warn) 14%,var(--well));stroke:var(--warn)}.note text{fill:var(--text);font:12.5px var(--sans);text-anchor:start;dominant-baseline:central;stroke:none}
marker path{stroke:none}@media (prefers-reduced-motion:reduce){.m{transition:none}}
</style></head><body>
<div class="eyebrow">Formato · sequência</div><h1>O que acontece, em ordem, quando o cliente clica em Pagar</h1>
<p class="lead">Cada coluna é um participante e o tempo corre para baixo. Use <b>Próxima</b> para revelar uma mensagem de cada vez; as futuras ficam esmaecidas.</p>
<div class="tools"><button id="prev" type="button">◀ Anterior</button><button id="next" type="button">Próxima ▶</button><button id="all" type="button">Mostrar tudo</button><button id="reset" type="button">Recomeçar</button><span id="count"></span></div>
<div class="stage"><svg id="svg" aria-label="Diagrama de sequência"></svg></div>
<script>
const ACTORS=[{id:'cli',n:'Cliente'},{id:'api',n:'API de pedidos'},{id:'gw',n:'Gateway'},{id:'fila',n:'Fila'},{id:'mail',n:'E-mail'}];
const MSGS=[
 {f:'cli',t:'api',x:'POST /pedidos',k:'call'},
 {f:'api',t:'api',x:'confere o carrinho',k:'self'},
 {f:'api',t:'gw',x:'cobra R$ 120,00',k:'call',note:'Idempotência: mesma chave não cobra duas vezes'},
 {f:'gw',t:'api',x:'aprovado',k:'return'},
 {f:'api',t:'fila',x:'pedido.pago',k:'async'},
 {f:'api',t:'cli',x:'201 pedido criado',k:'return'},
 {f:'fila',t:'mail',x:'envia o recibo',k:'async'}];
const NS='http://www.w3.org/2000/svg',GX=190,PX=100,TOP=30,HEAD=40,GY=64;
const X=Object.fromEntries(ACTORS.map((a,i)=>[a.id,PX+i*GX]));const vw=PX*2+(ACTORS.length-1)*GX,vh=TOP+HEAD+20+MSGS.length*GY+30;
const svg=document.getElementById('svg');svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);
let h='<defs>'+[['ma','var(--text)'],['mb','var(--brand)'],['mo','var(--text)']].map(([i,c],j)=>`<marker id="${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">${j===2?`<path d="M1 1L9 5L1 9" style="fill:none;stroke:${c};stroke-width:1.6"/>`:`<path d="M0 0L10 5L0 10z" style="fill:${c}"/>`}</marker>`).join('')+'</defs>';
ACTORS.forEach(a=>{h+=`<g class="head"><rect x="${X[a.id]-70}" y="${TOP-20}" width="140" height="${HEAD}" rx="10"/><text x="${X[a.id]}" y="${TOP}">${a.n}</text></g><line class="life" x1="${X[a.id]}" x2="${X[a.id]}" y1="${TOP+HEAD-20}" y2="${vh-14}"/>`});
MSGS.forEach((m,i)=>{const y=TOP+HEAD+30+i*GY,x1=X[m.f],x2=X[m.t];let g=`<g class="m future ${m.k==='return'?'ret':''}" data-i="${i}">`;
 if(m.k==='self'){g+=`<path class="ln" d="M${x1} ${y-10} h46 v22 h-46" marker-end="url(#ma)"/><text x="${x1+54}" y="${y+2}" style="text-anchor:start">${m.x}</text>`}
 else{const dir=x2>x1?1:-1,e1=x1+dir*4,e2=x2-dir*4;g+=`<line x1="${e1}" y1="${y}" x2="${e2}" y2="${y}" marker-end="url(#${m.k==='async'?'mo':'ma'})"/><text x="${(x1+x2)/2}" y="${y-9}">${m.x}</text>`}
 g+=`<text class="num" x="${Math.min(x1,x2)-14}" y="${y+4}" style="text-anchor:end">${i+1}</text>`;
 if(m.note){const w=m.note.length*6.6+20,nx=Math.max(x1,x2)+16;g+=`<g class="note"><rect x="${nx}" y="${y-30}" width="${w}" height="26" rx="6"/><text x="${nx+10}" y="${y-17}">${m.note}</text></g>`}
 h+=g+'</g>'});
svg.innerHTML=h;let k=0;
function render(){svg.querySelectorAll('.m').forEach(g=>{const i=+g.dataset.i;g.classList.remove('future','past','now');g.classList.add(i>k-1&&i>=k?'future':i===k-1?'now':'past')});
 document.getElementById('count').textContent=k?`Mensagem ${k} de ${MSGS.length}`:'Nenhuma mensagem revelada';document.getElementById('prev').disabled=k<=0;document.getElementById('next').disabled=k>=MSGS.length}
document.getElementById('next').onclick=()=>{k=Math.min(MSGS.length,k+1);render()};document.getElementById('prev').onclick=()=>{k=Math.max(0,k-1);render()};
document.getElementById('all').onclick=()=>{k=MSGS.length;render()};document.getElementById('reset').onclick=()=>{k=0;render()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){k=Math.min(MSGS.length,k+1);render()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){k=Math.max(0,k-1);render()}});render();
</script></body></html>
