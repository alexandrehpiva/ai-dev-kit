<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hierarquia em árvore</title>
<!--
  FORMATO: hierarquia em árvore (organograma, pastas, categorias, componentes). Responde "o que contém o quê?".
  COMO ADAPTAR: edite DATA (id, nome, descrição e filhos). IDEIA CENTRAL: padrão ARIA "tree": uma lista aninhada com
  role=tree/treeitem/group, aria-expanded e navegação por teclado (↑ ↓ percorrem, → abre/entra, ← fecha/sobe, Home/End, *
  abre tudo). Uma caixa de busca filtra e ABRE os ramos que contêm o resultado. O painel à direita mostra o item
  selecionado E o caminho até a raiz (migalhas), para o leitor nunca se perder em árvore funda.
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
button{font:inherit}:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--text);font:inherit}.tools button{background:transparent;color:var(--eyebrow);border:1px solid var(--panel-line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.tree{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;max-height:520px;overflow:auto}
ul[role=tree],ul[role=group]{list-style:none;margin:0;padding:0}ul[role=group]{margin-left:18px;border-left:1px solid var(--line);padding-left:6px}
li[role=treeitem]{outline:none}.row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:15px}
.row:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}li:focus-visible>.row{outline:2px solid var(--eyebrow);outline-offset:-2px}li[aria-selected=true]>.row{background:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--ink)}
.car{width:16px;color:var(--muted);transition:transform .15s;display:inline-block;text-align:center}li[aria-expanded=true]>.row .car{transform:rotate(90deg)}.leaf .car{visibility:hidden}
li[aria-expanded=false]>ul{display:none}.cnt{margin-left:auto;color:var(--muted);font-size:12px}mark{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;border-radius:3px}
.det{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:18px;display:grid;gap:10px;position:sticky;top:12px}.det h2{margin:0;font-size:20px;color:var(--ink)}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--soft)}.det p{margin:0;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.car{transition:none}}
</style></head><body>
<div class="eyebrow">Formato · hierarquia</div><h1>Quem responde a quem, e quem faz parte de quê</h1>
<p class="lead">Use as setas do teclado (↑ ↓ percorrem, → abre, ← fecha, * abre tudo) ou clique. A busca abre os ramos que contêm o resultado.</p>
<div class="wrap"><div><div class="tools"><input id="q" type="search" placeholder="Buscar..." aria-label="Buscar na árvore"><button id="all" type="button">Abrir tudo</button><button id="none" type="button">Fechar tudo</button></div><div class="tree"><ul role="tree" id="tree" aria-label="Estrutura"></ul></div></div><aside class="det" id="det"></aside></div>
<script>
const DATA={id:'org',n:'Empresa',d:'Raiz da estrutura.',c:[
 {id:'prod',n:'Produto',d:'Decide o que construir e em que ordem.',c:[{id:'po',n:'Donos de produto',d:'Escrevem as regras de negócio.',c:[]},{id:'ux',n:'Design',d:'Desenha a experiência e o design system.',c:[]}]},
 {id:'eng',n:'Engenharia',d:'Constrói e mantém o sistema.',c:[{id:'web',n:'Web',d:'Telas e experiência no navegador.',c:[{id:'fe1',n:'Time Carrinho',d:'Carrinho e checkout.',c:[]},{id:'fe2',n:'Time Conta',d:'Cadastro e login.',c:[]}]},{id:'api',n:'Plataforma',d:'APIs, filas e bancos.',c:[]},{id:'qa',n:'Qualidade',d:'Testes e gates de entrega.',c:[]}]},
 {id:'ops',n:'Operações',d:'Atendimento, financeiro e logística.',c:[{id:'fin',n:'Financeiro',d:'Cobrança e conciliação.',c:[]},{id:'log',n:'Logística',d:'Separação e envio.',c:[]}]}]};
const idx={},parent={};(function walk(n,p){idx[n.id]=n;parent[n.id]=p;n.c.forEach(c=>walk(c,n.id))})(DATA,null);
const open=new Set([DATA.id]);let sel='org',term='';const tree=document.getElementById('tree');
const count=n=>n.c.reduce((a,c)=>a+1+count(c),0);const has=(n,t)=>n.n.toLowerCase().includes(t)||n.c.some(c=>has(c,t));
const hlt=s=>term?s.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):s;
function node(n,lvl){if(term&&!has(n,term))return'';const kids=n.c.map(c=>node(c,lvl+1)).join(''),isOpen=term?true:open.has(n.id);
 return `<li role="treeitem" data-id="${n.id}" aria-level="${lvl}" aria-selected="${sel===n.id}" ${n.c.length?`aria-expanded="${isOpen}"`:''} tabindex="${sel===n.id?0:-1}" class="${n.c.length?'':'leaf'}"><div class="row"><span class="car">▸</span><span>${hlt(n.n)}</span>${n.c.length?`<span class="cnt">${count(n)}</span>`:''}</div>${kids?`<ul role="group">${kids}</ul>`:''}</li>`}
function draw(keepFocus){tree.innerHTML=node(DATA,1);const d=idx[sel],path=[];for(let p=sel;p;p=parent[p])path.unshift(idx[p].n);
 document.getElementById('det').innerHTML=`<div class="crumb">${path.map((x,i)=>i===path.length-1?`<b>${x}</b>`:x).join(' › ')}</div><h2>${d.n}</h2><p>${d.d}</p><p class="crumb">${d.c.length?`${d.c.length} filho(s) direto(s), ${count(d)} no total.`:'Item final: não tem filhos.'}</p>`;
 if(keepFocus){const li=tree.querySelector(`li[data-id="${sel}"]`);if(li)li.focus()}}
const vis=()=>[...tree.querySelectorAll('li[role=treeitem]')].filter(li=>!li.parentElement.closest('li[aria-expanded=false]'));
tree.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;sel=li.dataset.id;if(e.target.closest('.car')&&idx[sel].c.length)toggle(sel);draw(true)});
function toggle(id,force){const o=force==null?!open.has(id):force;o?open.add(id):open.delete(id)}
tree.addEventListener('keydown',e=>{const li=e.target.closest('li');if(!li)return;const id=li.dataset.id,n=idx[id],list=vis(),i=list.indexOf(li);let h=true;
 if(e.key==='ArrowDown')sel=list[Math.min(list.length-1,i+1)].dataset.id;else if(e.key==='ArrowUp')sel=list[Math.max(0,i-1)].dataset.id;
 else if(e.key==='ArrowRight'){if(n.c.length&&!open.has(id))toggle(id,true);else if(n.c.length)sel=n.c[0].id}
 else if(e.key==='ArrowLeft'){if(n.c.length&&open.has(id))toggle(id,false);else if(parent[id])sel=parent[id]}
 else if(e.key==='Home')sel=list[0].dataset.id;else if(e.key==='End')sel=list[list.length-1].dataset.id;
 else if(e.key==='*'){Object.keys(idx).forEach(k=>idx[k].c.length&&open.add(k))}else h=false;
 if(h){e.preventDefault();draw(true)}});
document.getElementById('q').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();draw(false)});
document.getElementById('all').onclick=()=>{Object.keys(idx).forEach(k=>idx[k].c.length&&open.add(k));draw()};document.getElementById('none').onclick=()=>{open.clear();open.add(DATA.id);draw()};draw();
</script></body></html>
