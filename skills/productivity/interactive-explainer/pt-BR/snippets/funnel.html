<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funil</title>
<!--
  FORMATO: funil. Responde "quantos chegam a cada etapa e ONDE perdemos mais gente?".
  COMO ADAPTAR: edite STAGES (nome, valor absoluto e, opcional, o motivo da perda). IDEIA CENTRAL: duas leituras no mesmo
  desenho. A largura da barra mostra o volume restante; o número entre barras mostra a PERDA daquele passo (o que o funil
  esconde se você só olha o total). A maior perda é marcada automaticamente. Alternar absoluto/percentual muda o rótulo,
  nunca a geometria (barra proporcional ao primeiro estágio nas duas leituras, para não enganar).
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
button{font:inherit}:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.seg{display:flex;gap:6px;margin-bottom:16px}.seg button{background:transparent;color:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}.seg button[aria-pressed=true]{background:var(--card);border-color:var(--brand);color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.funnel{display:grid;gap:0}.stage{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:12px;padding:3px 0;background:none;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:10px}
.stage .nm{font-size:14px;color:var(--soft);text-align:right}.stage.sel .nm{color:var(--ink);font-weight:600}
.track{position:relative;height:44px}.bar{height:100%;border-radius:8px;background:color-mix(in srgb,var(--brand) 70%,transparent);display:flex;align-items:center;padding-left:12px;color:#fff;font:700 14px var(--mono);min-width:56px;transition:width .4s}
.stage.sel .bar{background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent)}
.loss{display:grid;grid-template-columns:140px 1fr;gap:12px;font-size:13px;color:var(--muted);padding:2px 0}.loss span{grid-column:2;display:flex;align-items:center;gap:8px}.loss b{color:var(--danger)}.loss .worst{color:var(--danger);font-weight:700}
.side{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:18px;display:grid;gap:10px;position:sticky;top:12px}.side h2{margin:0;font-size:20px;color:var(--ink)}.side .big{font-size:34px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}.side p{margin:0;color:var(--soft)}.side small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style></head><body>
<div class="eyebrow">Formato · funil</div><h1>De quem visita a quem recebe o pedido</h1>
<p class="lead">A largura da barra é o volume que sobrou; o texto entre as barras é quanto se perdeu naquele passo. A maior perda aparece em vermelho. Clique numa etapa para ver o motivo.</p>
<div class="seg" role="group" aria-label="Modo de leitura"><button type="button" id="mabs" aria-pressed="true">Número absoluto</button><button type="button" id="mpct" aria-pressed="false">% do início</button></div>
<div class="wrap"><div class="funnel" id="f"></div><aside class="side" id="s"></aside></div>
<script>
const STAGES=[{n:'Visitou a loja',v:12000,why:'Ponto de partida: pessoas que abriram qualquer página.'},{n:'Viu um produto',v:7200,why:'Quem sai aqui costuma ter chegado por anúncio genérico, sem intenção de compra.'},{n:'Adicionou ao carrinho',v:2100,why:'A página do produto não deixa o frete claro; o preço final só aparece depois.'},{n:'Iniciou o pagamento',v:1300,why:'Cadastro obrigatório antes de pagar afasta quem só queria comprar uma vez.'},{n:'Pagou',v:960,why:'Recusa de cartão e boleto vencido respondem por quase toda a perda.'},{n:'Recebeu',v:930,why:'Perda mínima: extravio e devolução na porta.'}];
let mode='abs',sel=2;const f=document.getElementById('f'),s=document.getElementById('s'),first=STAGES[0].v;  // não chame de `top`: colide com window.top

const fmt=v=>mode==='abs'?v.toLocaleString('pt-BR'):(v/first*100).toFixed(1).replace('.',',')+'%';
const drops=STAGES.map((x,i)=>i?STAGES[i-1].v-x.v:0),worst=drops.indexOf(Math.max(...drops));
function draw(){f.innerHTML=STAGES.map((x,i)=>`${i?`<div class="loss"><span>${i===worst?'<span class="worst">▼ maior perda</span>':'▼'} <b>−${mode==='abs'?drops[i].toLocaleString('pt-BR'):(drops[i]/STAGES[i-1].v*100).toFixed(0)+'%'}</b> ${mode==='abs'?'saem aqui':'dos que chegaram saem aqui'}</span></div>`:''}<button type="button" class="stage${i===sel?' sel':''}" data-i="${i}"><span class="nm">${x.n}</span><span class="track"><span class="bar" style="width:${Math.max(4,x.v/first*100)}%">${fmt(x.v)}</span></span></button>`).join('');
 const x=STAGES[sel],conv=sel?(x.v/STAGES[sel-1].v*100).toFixed(0):100;
 s.innerHTML=`<h2>${x.n}</h2><div class="big">${x.v.toLocaleString('pt-BR')}</div><small>${(x.v/first*100).toFixed(1).replace('.',',')}% de quem começou</small>${sel?`<p><b style="color:var(--ink)">${conv}%</b> de quem estava na etapa anterior chegou aqui (${drops[sel].toLocaleString('pt-BR')} saíram).</p>`:''}<p>${x.why}</p>`}
f.addEventListener('click',e=>{const b=e.target.closest('.stage');if(b){sel=+b.dataset.i;draw()}});
document.getElementById('mabs').onclick=()=>{mode='abs';document.getElementById('mabs').setAttribute('aria-pressed',true);document.getElementById('mpct').setAttribute('aria-pressed',false);draw()};
document.getElementById('mpct').onclick=()=>{mode='pct';document.getElementById('mabs').setAttribute('aria-pressed',false);document.getElementById('mpct').setAttribute('aria-pressed',true);draw()};draw();
</script></body></html>
