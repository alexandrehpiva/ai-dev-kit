<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de jornada</title>
<!--
  FORMATO: mapa de jornada. Responde "como a pessoa SE SENTE ao longo do caminho, e onde dói?".
  COMO ADAPTAR: edite STAGES (nome, ação, pensamento, emoção -2..+2, ponto de dor e oportunidade).
  IDEIA CENTRAL: uma única curva de emoção atravessa todas as etapas, alinhada às colunas de texto. Os vales são as dores; ao
  clicar numa etapa, o detalhe mostra a oportunidade. A curva é um <svg> medido pela MESMA grade das colunas (flex igual),
  então o ponto de cada etapa fica exatamente sobre a coluna certa em qualquer largura.
-->
<style>
:root{color-scheme:dark light;--bg:#1C1C1F;--card:#26262B;--line:#38383E;--panel:#16233B;--panel-line:#2C3F66;--well:#0E1730;--ink:#fff;--text:#E4E4E7;--soft:#C9C9CE;--muted:#9A9AA0;--brand:#5C80FF;--eyebrow:#7D9BFF;--ok:#43D07E;--warn:#E8B23E;--danger:#F2867A;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#F6F6F4;--card:#fff;--line:#D9D9DF;--panel:#EAF0FF;--panel-line:#BFCDF5;--well:#F0F3FA;--ink:#101114;--text:#25262B;--soft:#4A4B52;--muted:#6B6C74;--brand:#3558E6;--eyebrow:#3558E6;--ok:#157A43;--warn:#8A6100;--danger:#B3382B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding:clamp(16px,3vw,40px)}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 6px;color:var(--ink);font-weight:500;letter-spacing:-.02em}.lead{color:var(--soft);margin:0 0 20px;max-width:820px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
button{font:inherit}:focus-visible{outline:2px solid var(--eyebrow);outline-offset:2px}
.map{overflow-x:auto;border:1px solid var(--panel-line);border-radius:14px;background:var(--well)}.inner{min-width:820px;display:grid;grid-template-columns:128px 1fr}
.lbl{padding:12px 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--panel-line);display:flex;align-items:center}
.cols{display:grid;grid-template-columns:repeat(var(--n),1fr)}.col{padding:12px;border-top:1px solid var(--panel-line);border-left:1px solid var(--panel-line);font-size:14px;color:var(--soft);background:none;text-align:left;color:inherit}
.head{border-top:0}.stg{cursor:pointer;display:block;width:100%;font:600 15px var(--sans);color:var(--ink);border:0;border-left:1px solid var(--panel-line);background:none;padding:12px;text-align:left}.stg.sel,.stg:hover{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.col.sel{background:color-mix(in srgb,var(--brand) 8%,transparent)}.curve{position:relative;height:150px;border-top:1px solid var(--panel-line)}.curve svg{position:absolute;inset:0;width:100%;height:100%}
.zero{stroke:var(--panel-line);stroke-dasharray:4 4}.line{fill:none;stroke:var(--brand);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.dot{fill:var(--card);stroke:var(--brand);stroke-width:3}.dot.low{stroke:var(--danger)}.dot.sel{fill:var(--brand)}.emo{font-size:20px}
.pain{color:var(--danger)}.opp{color:var(--ok)}.det{margin-top:14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:16px;display:grid;gap:6px}.det h2{margin:0;font-size:18px;color:var(--ink)}.det p{margin:0;color:var(--soft)}
</style></head><body>
<div class="eyebrow">Formato · jornada</div><h1>A jornada de quem compra pela primeira vez</h1>
<p class="lead">A linha azul é como a pessoa se sente em cada etapa; os pontos vermelhos são as dores. Clique numa etapa para ver a dor e a oportunidade.</p>
<div class="map"><div class="inner" id="inner"></div></div><div class="det" id="det"></div>
<script>
const STAGES=[
 {n:'Descobre',a:'Chega por um anúncio',t:'"Será que é confiável?"',e:1,pain:'Não acha prazo de entrega na primeira tela.',opp:'Mostrar frete e prazo já na página do produto.'},
 {n:'Escolhe',a:'Compara 3 produtos',t:'"Qual tem melhor avaliação?"',e:2,pain:'',opp:'Destacar avaliações verificadas.'},
 {n:'Cadastra',a:'Cria conta para comprar',t:'"Eu só queria comprar uma vez..."',e:-2,pain:'Cadastro obrigatório com 9 campos.',opp:'Permitir comprar como convidado; pedir senha depois.'},
 {n:'Paga',a:'Informa o cartão',t:'"E se der erro?"',e:-1,pain:'Mensagem de erro técnica quando o cartão é recusado.',opp:'Explicar o motivo em linguagem simples e oferecer outro meio.'},
 {n:'Espera',a:'Aguarda o pacote',t:'"Cadê meu pedido?"',e:0,pain:'Rastreio só atualiza uma vez ao dia.',opp:'Avisar por mensagem a cada mudança de estado.'},
 {n:'Recebe',a:'Abre o pacote',t:'"Chegou certinho!"',e:2,pain:'',opp:'Pedir avaliação na hora, enquanto a satisfação está alta.'}];
const inner=document.getElementById('inner'),n=STAGES.length;let sel=2;const emojis={'-2':'😣','-1':'🙁','0':'😐','1':'🙂','2':'😄'};
function draw(){const row=(label,fn,cls='')=>`<div class="lbl">${label}</div><div class="cols" style="--n:${n}">${STAGES.map((s,i)=>`<div class="col ${cls}${i===sel?' sel':''}">${fn(s,i)}</div>`).join('')}</div>`;
 inner.innerHTML=`<div class="lbl head" style="border:0">Etapa</div><div class="cols" style="--n:${n}">${STAGES.map((s,i)=>`<button type="button" class="stg${i===sel?' sel':''}" data-i="${i}" aria-pressed="${i===sel}">${i+1}. ${s.n}</button>`).join('')}</div>`
 +row('Ação',s=>s.a)+row('Pensa',s=>`<i>${s.t}</i>`)+row('Sente',s=>`<span class="emo">${emojis[s.e]}</span>`)
 +`<div class="lbl">Curva</div><div class="curve" id="curve"><svg id="cv" preserveAspectRatio="none"></svg></div>`+row('Dor',s=>s.pain?`<span class="pain">${s.pain}</span>`:'—')+row('Oportunidade',s=>`<span class="opp">${s.opp}</span>`);
 curve();const s=STAGES[sel];document.getElementById('det').innerHTML=`<h2>${sel+1}. ${s.n}</h2>${s.pain?`<p><b class="pain">Dor:</b> ${s.pain}</p>`:'<p>Sem dor relevante nesta etapa.</p>'}<p><b class="opp">Oportunidade:</b> ${s.opp}</p>`}
function curve(){const box=document.getElementById('curve'),w=box.clientWidth,h=box.clientHeight,pad=24,x=i=>(i+.5)*w/n,y=e=>pad+(2-e)*(h-2*pad)/4;
 const svg=document.getElementById('cv');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','none');
 // curva suave (Catmull-Rom -> Bézier) passando por todos os pontos
 const P=STAGES.map((s,i)=>[x(i),y(s.e)]);let d=`M${P[0][0]} ${P[0][1]}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6},${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6},${p2[0]} ${p2[1]}`}
 svg.innerHTML=`<line class="zero" x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}"/><path class="line" d="${d}"/>`+P.map((p,i)=>`<circle class="dot${STAGES[i].e<0?' low':''}${i===sel?' sel':''}" cx="${p[0]}" cy="${p[1]}" r="7"/>`).join('')}
inner.addEventListener('click',e=>{const b=e.target.closest('.stg');if(b){sel=+b.dataset.i;draw()}});new ResizeObserver(()=>curve()).observe(inner);draw();
</script></body></html>
